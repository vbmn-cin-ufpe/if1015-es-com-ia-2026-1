services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codecompass}
      POSTGRES_USER: ${POSTGRES_USER:-codecompass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"

  chroma:
    image: chromadb/chroma:0.5.5
    ports:
      - "8001:8000"

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-codecompass}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-codecompass}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      ALLOW_LOCAL_REPOS: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-abacus}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-CLAUDE_V3_5_SONNET}
      # Embedding backend: "local" (CPU, sem chave) ou "openai" (rápido, precisa OPENAI_API_KEY)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      EMBEDDING_MAX_WORKERS: ${EMBEDDING_MAX_WORKERS:-4}
      # Admin seed
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # JWT auth
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      # Azure Communication Services email (optional in dev — emails logged to console)
      AZURE_EMAIL_CONNECTION_STRING: ${AZURE_EMAIL_CONNECTION_STRING:-}
      AZURE_EMAIL_FROM: ${AZURE_EMAIL_FROM:-donotreply@codecompass.dev}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - chroma

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend