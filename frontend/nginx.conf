server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Cache para assets com hash no nome (JS/CSS gerados pelo Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — todas as rotas não encontradas servem o index.html
    # Necessário para React Router funcionar com refresh de página
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check para o Container Apps liveness probe
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
