[project]
name = "codecompass-backend"
version = "0.2.0"
description = "CodeCompass backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "chromadb==0.5.5",
  "psycopg[binary]==3.3.4",
  "openai==1.59.8",
  "abacusai>=1.3.0",
  "sentence-transformers==3.3.1",
  "radon==6.0.1",
  "gitpython==3.1.43",
  # Multi-language parsing via tree-sitter
  "tree-sitter==0.23.2",
  # Tier 1 — languages with pinned versions (already tested)
  "tree-sitter-python==0.23.6",
  "tree-sitter-javascript==0.23.1",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-java==0.23.5",
  "tree-sitter-go==0.23.4",
  "tree-sitter-rust==0.23.2",
  # Tier 2 — additional commercial languages (graceful fallback if unavailable)
  "tree-sitter-c>=0.23.0",
  "tree-sitter-cpp>=0.23.0",
  "tree-sitter-c-sharp>=0.23.0",
  "tree-sitter-ruby>=0.23.0",
  "tree-sitter-php>=0.23.0",
  "tree-sitter-kotlin>=0.23.0",
  "tree-sitter-scala>=0.23.0",
  "tree-sitter-bash>=0.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]