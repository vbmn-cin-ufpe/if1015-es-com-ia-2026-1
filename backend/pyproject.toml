[project]
name = "codecompass-backend"
version = "0.2.0"
description = "CodeCompass backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "chromadb==0.5.23",
  "psycopg[binary]==3.3.4",
  "openai==1.59.8",
  "sentence-transformers==3.3.1",
  "radon==6.0.1",
  "gitpython==3.1.43",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]